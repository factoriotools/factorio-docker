name: Docker build & push

on:
  push:
    branches:
      - master
    paths:
      - buildinfo.json
      - build.py
      - 'docker/**'
  workflow_call:
    inputs:
      previous_sha:
        type: string
        required: false
        default: ''
      checkout_ref:
        type: string
        required: false
        default: ''
  # workaround for #526
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push changed images
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PREVIOUS_SHA: ${{ inputs.previous_sha || github.event.before }}
        run: |
          args=(--push-tags --multiarch --both)
          # Runtime/build changes and manual runs rebuild all current versions.
          if [[ -n "$PREVIOUS_SHA" ]] && git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            if git diff --quiet "$PREVIOUS_SHA" HEAD -- docker build.py; then
              args+=(--changed-from "$PREVIOUS_SHA")
            fi
          fi
          ./build.py "${args[@]}"
