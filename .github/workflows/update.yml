name: Check Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'factoriotools/factorio-docker'
    outputs:
      sha: ${{ steps.update.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run update script
        id: update
        run: |
          ./update.sh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so build explicitly.
  build:
    needs: check
    if: needs.check.outputs.sha != github.sha
    uses: ./.github/workflows/docker-build.yml
    with:
      previous_sha: ${{ github.sha }}
      checkout_ref: ${{ needs.check.outputs.sha }}
    secrets: inherit
