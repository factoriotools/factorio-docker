name: Lint

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ShellCheck
        run: git ls-files -z '*.sh' '*.bats' | xargs -0 shellcheck --severity=warning

      # hadolint 2.15 misreports [[ ]] in RUN despite SHELL bash; v3.3.0 bundles 2.14.0.
      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/Dockerfile

      - name: Hadolint Dockerfile.rootless
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/Dockerfile.rootless
