name: Build Factorio Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/saucymanwich/factorio:2.1.25
          build-args: |
            VERSION=2.1.25
            SHA256=78da2f5aa99e9e0af7586d6bf82c04aae91165d53036720dabb26e855688f3ae
            SHA256_ARM64=c10ab4008043713b6e37097850c69ff675acac7ab965e87d768ce46d0c1753fd